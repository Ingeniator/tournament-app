    <h1>Which Padel Tournament Format Should You Choose?</h1>
    <p>The right format depends on your group, time, and vibe. Here's a quick guide to help you pick the best padel tournament format.</p>
    <nav><a href="/">PadelDay Home</a> &gt; Which Format</nav>

    <h2>Quick Decision Guide</h2>
    <ul>
      <li><strong>First time organizing?</strong> Americano. Simplest format, everyone plays with everyone.</li>
      <li><strong>Competitive group, similar levels?</strong> Mexicano. Standings-based matchups create tighter games.</li>
      <li><strong>Mixed men &amp; women?</strong> Mixicano. Ensures every team has one player from each group.</li>
      <li><strong>Couples or fixed pairs?</strong> Team Americano. Partners stay together, opponents rotate.</li>
      <li><strong>Short on time or odd player count?</strong> King of the Court. Fast rounds, flexible player count.</li>
      <li><strong>Running a league or weekly event?</strong> Club formats. Track standings across multiple sessions.</li>
    </ul>

    <h2>By Group Size</h2>
    <ul>
      <li>4-6 players: King of the Court or Americano (1 court)</li>
      <li>8 players: Americano or Mexicano (2 courts)</li>
      <li>12 players: Mexicano (3 courts)</li>
      <li>16+ players: Any format (4+ courts)</li>
      <li>Odd number: King of the Court</li>
    </ul>

    <h2>By Event Type</h2>
    <ul>
      <li>After-work social: Americano + curse cards</li>
      <li>Club championship: Mexicano</li>
      <li>Couples night: Team Americano or Mixed Team Americano</li>
      <li>Charity/corporate event: Americano</li>
      <li>Weekly recurring: Club Americano or Club Mexicano</li>
    </ul>

    <h2>By Time Available</h2>
    <ul>
      <li>1 hour: King of the Court</li>
      <li>2 hours: Americano (5 rounds)</li>
      <li>3 hours: Mexicano (7 rounds)</li>
      <li>Half day: Multiple formats in sequence</li>
    </ul>
