    <h1>Mexicano Padel for 16 Players</h1>
    <p>16 players on 4 courts — the largest common Mexicano setup. More players means more rounds needed, but the standings-based matching keeps every game competitive.</p>
    <nav><a href="/">PadelDay Home</a> &gt; <a href="/formats">Formats</a> &gt; <a href="/mexicano">Mexicano</a> &gt; 16 Players</nav>

    <h2>The Setup</h2>
    <p>16 players, 4 courts. All courts play simultaneously. First round is random, then matchups are standings-based.</p>

    <h2>Managing 16 Players</h2>
    <p>Communication is key. Use a big screen or have players check the app between rounds. Brief players on court assignments before each round.</p>

    <h2>How Many Courts?</h2>
    <p>4 courts for 4 simultaneous matches per round. Ideally all courts finish around the same time.</p>

    <h2>Sample Timeline</h2>
    <p>Total: approximately 3.5-4 hours. Arrival: 15 minutes. 9-11 rounds at about 18 minutes each. Awards: 15 minutes.</p>

    <h2>How Many Rounds?</h2>
    <p>Minimum 9 rounds, ideally 11. With 16 players there are 15 possible partners, so more rounds produce fairer results.</p>

    <h2>Scoring Tips</h2>
    <p>Use 24 points per match instead of 32 to keep rounds short and fit more rounds into your time slot.</p>

    <h2>What If People Arrive Late or Leave Early?</h2>
    <p>Late arrivals can join from round 2. If someone leaves, continue with fewer players or adjust courts.</p>

    <h2>16 Players: Americano or Mexicano?</h2>
    <p>Both work well. Americano is simpler to explain. Mexicano rewards better play. <a href="/americano-vs-mexicano">Read the full comparison</a>.</p>
