    <h2>Choosing a Format</h2>
    <ul>
      <li><strong>Team Americano</strong> — Fixed pairs from each club, rotating opponents. Best for 2 clubs.</li>
      <li><strong>Team Mexicano</strong> — Fixed pairs, standings-based opponents. More competitive.</li>
      <li><strong>Mixed Inter-Club</strong> — Cross-club pairs for building community.</li>
      <li><strong>Americano Free-for-All</strong> — Individual standings, partners rotate across clubs.</li>
    </ul>
