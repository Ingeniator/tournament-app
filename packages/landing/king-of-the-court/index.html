    <h2>What is King of the Court?</h2>
    <p>A high-energy format where the winning team holds the court and faces a new challenger each match. Losers go to the back of the queue. Quick matches, constant rotation, and natural drama.</p>

    <h2>How It Works</h2>
    <ol>
      <li>Form teams of two and set up a queue</li>
      <li>Two teams play a short match (to 7–11 points)</li>
      <li>The winning team stays on court</li>
      <li>The losing team goes to the back of the queue</li>
      <li>The next team in line challenges the winners</li>
      <li>Track cumulative scores — highest total wins</li>
    </ol>

    <h2>Frequently Asked Questions</h2>
    <h3>How many players do you need?</h3>
    <p>At least 6 players (3 teams). Works great with any number, including odd numbers.</p>
    <h3>How does scoring work?</h3>
    <p>Multiple options: points per win, points from match, or streak bonuses. The team with the highest cumulative score wins.</p>
    <h3>Can you play with an odd number of players?</h3>
    <p>Yes! Since teams rotate through a queue, odd numbers work naturally.</p>
    <h3>How is it different from Americano?</h3>
    <p>In <a href="/americano">Americano</a>, all players play equal rounds. In King of the Court, winners stay on — creating streaks, upsets, and natural drama.</p>
