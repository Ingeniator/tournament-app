    <h1>Mexicano Padel for 12 Players — The Ideal Setup</h1>
    <p>12 players on 3 courts is where Mexicano truly shines. Enough players for meaningful standings-based matchups, and enough courts for everyone to play every round.</p>
    <nav><a href="/">PadelDay Home</a> &gt; <a href="/formats">Formats</a> &gt; <a href="/mexicano">Mexicano</a> &gt; 12 Players</nav>

    <h2>Why 12 Players is Perfect for Mexicano</h2>
    <p>With 12 players, the algorithm has enough data after 2-3 rounds to create genuinely balanced matches. The top court gets competitive, the bottom court stays fun.</p>

    <h2>The Setup</h2>
    <p>12 players, 3 courts. First round is random, then matchups are based on standings. All courts play simultaneously.</p>

    <h2>How the Algorithm Works with 12 Players</h2>
    <p>After round 1, players are ranked 1-12 by points. Players ranked 1-4 play on court 1, 5-8 on court 2, 9-12 on court 3. Within each court, the algorithm pairs players for balanced teams.</p>

    <h2>Sample Timeline</h2>
    <p>Total: approximately 3 hours. Arrival and setup: 15 minutes. 7-9 rounds at about 18 minutes each. Awards ceremony: 15 minutes.</p>

    <h2>How Many Rounds?</h2>
    <p>7 rounds minimum, 9 is ideal. More rounds mean fairer final standings.</p>

    <h2>Tips for 12-Player Mexicano</h2>
    <ul>
      <li>Keep rounds short (24 points) to fit more rounds into your session</li>
      <li>Let the app calculate everything — manual standings-based pairings are nearly impossible</li>
    </ul>

    <h2>Mexicano vs Americano for 12 Players</h2>
    <p>At 12 players, Mexicano is clearly better than Americano. The standings-based matchups create more balanced, competitive games for everyone. <a href="/americano-vs-mexicano">Read the full comparison</a>.</p>
