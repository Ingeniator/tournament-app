    <h1>Americano Padel for 12 Players</h1>
    <p>12 players on 3 courts — the sweet spot for club events. Everyone plays every round, partners rotate, and the tournament wraps up in about 3 hours.</p>
    <nav><a href="/">PadelDay Home</a> &gt; <a href="/formats">Formats</a> &gt; <a href="/americano">Americano</a> &gt; 12 Players</nav>

    <h2>The Setup</h2>
    <p>12 players, 3 courts. Each round, 4 players are assigned to each court (2 teams of 2). All 12 players are active every round — no one sits out.</p>

    <h2>Sample Timeline</h2>
    <p>Arrival + warm-up: 15 min. 7 rounds x 18 min: 126 min. Awards: 15 min. Total: ~2 hours 40 min.</p>
    <p>With 9 rounds: add ~36 min for a total of ~3 hours 15 min.</p>

    <h2>How Many Rounds?</h2>
    <p>With 12 players, there are 11 possible partners. 7-9 rounds gives fair standings. 11 rounds is a complete rotation but takes 3.5+ hours.</p>

    <h2>Court Management</h2>
    <p>All 3 courts play at the same time. Wait for all courts to finish before starting the next round. Use the break for water and checking standings.</p>

    <h2>Consider Mexicano</h2>
    <p>With 12 players, Mexicano's standings-based matchups really shine. Games get progressively more balanced as the tournament goes on. Great for groups with mixed skill levels.</p>

    <h2>What If You Have 11 or 13?</h2>
    <p>With odd numbers, one player sits out each round and rotates in. The app handles this automatically.</p>
