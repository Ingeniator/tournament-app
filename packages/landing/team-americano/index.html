    <h2>What is Team Americano?</h2>
    <p>Team Americano keeps the social rotation of opponents from regular Americano but lets you play the entire tournament with your chosen partner. Teams accumulate points together and standings are tracked per team, not per individual.</p>

    <h2>How to Play</h2>
    <ol>
      <li>Form fixed teams of 2 players each (minimum 4 teams)</li>
      <li>Book 1 court per 2 teams playing simultaneously</li>
      <li>Each round, teams are assigned random opponents</li>
      <li>Play each match to a fixed point total (e.g. 32 points)</li>
      <li>Both partners share the team score — points accumulate across rounds</li>
      <li>After all rounds, the team with the most points wins</li>
    </ol>

    <h2>Frequently Asked Questions</h2>
    <h3>How is Team Americano different from regular Americano?</h3>
    <p>In regular <a href="/americano">Americano</a>, partners rotate every round and standings are individual. In Team Americano, partners are fixed and standings are tracked per team.</p>
    <h3>How many players do you need?</h3>
    <p>Minimum 8 players (4 teams of 2). Ideally 8–16 players for a balanced tournament.</p>
    <h3>How does scoring work?</h3>
    <p>Each match is played to a fixed number of points. Both partners share the same score. Team points accumulate across all rounds.</p>
    <h3>How long does a tournament take?</h3>
    <p>With 8 players on 2 courts: 1.5–2.5 hours. With 16 players on 4 courts: 2.5–3.5 hours.</p>
