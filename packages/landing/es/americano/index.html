    <h2>¿Qué es el Americano de Padel?</h2>
    <p>Un formato de torneo social donde las parejas cambian cada ronda. Juegas con un compañero diferente en cada partido y tu puntuación individual se acumula. Es el formato perfecto para grupos de niveles mixtos.</p>
    <h2>Cómo Jugar</h2>
    <ol>
      <li>Reúne 4-16 jugadores y reserva 1 pista por cada 4 jugadores</li>
      <li>Cada ronda, las parejas se asignan aleatoriamente</li>
      <li>Juega cada partido a un total de puntos fijo (ej. 32 puntos)</li>
      <li>Los puntos se suman al total individual de cada jugador</li>
      <li>Después de todas las rondas, gana el jugador con más puntos</li>
    </ol>
