    <h1>Best Padel Tournament Format for Beginners</h1>
    <p>Never organized a padel tournament before? You don't need experience. Pick the right format, and the app does the rest.</p>
    <nav><a href="/">PadelDay Home</a> &gt; Beginners</nav>

    <h2>What is a Padel Tournament?</h2>
    <p>It's not a single match — it's a series of matches where players accumulate points. At the end, someone wins. But the real point is that everyone plays and everyone has fun.</p>

    <h2>Beginner-Friendly Formats</h2>
    <h3>Americano (Recommended)</h3>
    <p>Partners rotate every round. Everyone plays with everyone. Individual standings. No one is stuck with a bad partner, and the randomness keeps it social. <a href="/americano">Learn more about Americano</a></p>
    <h3>King of the Court</h3>
    <p>Winners stay, losers rotate off. No scheduling needed. Great for casual groups and odd player counts. <a href="/king-of-the-court">Learn more about King of the Court</a></p>
    <h3>Team Americano</h3>
    <p>Partners stay together, opponents rotate. Good when people want to play with their friend or partner. <a href="/team-americano">Learn more about Team Americano</a></p>

    <h2>How Scoring Works</h2>
    <ul>
      <li>Teams play to a set number of points (e.g., 32 total)</li>
      <li>If you win 20-12, you get 20 points, they get 12</li>
      <li>Your points add up across all matches</li>
      <li>Most points at the end wins</li>
    </ul>

    <h2>Your First Tournament — Step by Step</h2>
    <ol>
      <li>Get 8 friends</li>
      <li>Book 2 padel courts for 2 hours</li>
      <li>Open PadelDay, add names, pick Americano</li>
      <li>Play 5-7 rounds</li>
      <li>Enter scores after each match</li>
      <li>Enjoy the awards ceremony</li>
    </ol>

    <h2>Common Beginner Questions</h2>
    <h3>What if skill levels are very different?</h3>
    <p>Americano rotates partners, so strong players lift weaker ones. Or use <a href="/mexicano">Mexicano</a> for standings-based matchups.</p>
    <h3>What if we have an odd number?</h3>
    <p>Use King of the Court, or have one person sit out each round — the app handles this.</p>
    <h3>How long will it take?</h3>
    <p>8 players, 2 courts, 5 rounds = about 2 hours. <a href="/how-long-padel-tournament">More details</a></p>
    <h3>Do we need a referee?</h3>
    <p>No. Players enter their own scores on the app.</p>

    <p><a href="/play">Run your first tournament — it's free</a></p>
