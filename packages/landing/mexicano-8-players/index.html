    <h1>Mexicano Padel for 8 Players</h1>
    <p>8 players, 2 courts, standings-based matchups. Mexicano automatically creates balanced, competitive games by matching players based on their current ranking.</p>

    <h2>The Setup</h2>
    <p>8 players, 2 courts. Round 1 is random. From round 2 onwards, matchups are based on the current standings.</p>

    <h2>How Matchups Work</h2>
    <p>After round 1, the app ranks all 8 players by total points. Players ranked 1-4 play on one court, players ranked 5-8 on the other. Within each court, partners are assigned to avoid repeated pairings. This means the best players face each other, and struggling players get more evenly matched games.</p>

    <h2>Sample Tournament Flow</h2>
    <p>Round 1: Random pairs. Round 2-3: Standings start to form, matchups adjust. Round 4-5: Clear leaders emerge, top table gets competitive. Round 6-7: Final rounds are tight matches between closely ranked players.</p>

    <h2>How Many Rounds?</h2>
    <p>7+ rounds recommended. Mexicano needs enough rounds for the standings algorithm to create balanced matchups.</p>

    <h2>Mexicano vs Americano for 8 Players</h2>
    <p>With only 8 players, the difference is subtle. Americano is simpler (random pairings). Mexicano rewards consistency and creates tighter games in later rounds.</p>

    <h2>Tips</h2>
    <p>Let the app handle matchups — manual Mexicano is nearly impossible. Use 24-32 points per match.</p>
