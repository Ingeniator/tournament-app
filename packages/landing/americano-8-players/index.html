    <h1>Americano Padel for 8 Players</h1>
    <p>The most common Americano setup: 8 players, 2 courts, about 2 hours. Every player partners with everyone else across 7 rounds of rotating pairs.</p>
    <nav><a href="/">PadelDay Home</a> &gt; <a href="/formats">Formats</a> &gt; <a href="/americano">Americano</a> &gt; 8 Players</nav>

    <h2>The Setup</h2>
    <p>8 players split across 2 courts. Each round, 4 players are assigned to each court as 2 teams of 2. Partners rotate every round so everyone plays with everyone.</p>

    <h2>Sample Schedule</h2>
    <p>Round 1: Court 1 — A+B vs C+D, Court 2 — E+F vs G+H</p>
    <p>Round 2: Court 1 — A+C vs E+G, Court 2 — B+D vs F+H</p>
    <p>Round 3: Court 1 — A+D vs F+G, Court 2 — B+C vs E+H</p>
    <p>Round 4: Court 1 — A+E vs B+F, Court 2 — C+G vs D+H</p>
    <p>Round 5: Court 1 — A+F vs D+G, Court 2 — B+E vs C+H</p>
    <p>Round 6: Court 1 — A+G vs D+F, Court 2 — B+H vs C+E</p>
    <p>Round 7: Court 1 — A+H vs C+F, Court 2 — B+G vs D+E</p>
    <p>Timeline: Arrival + warm-up (15 min), 7 rounds x 15 min (105 min), Awards (10 min) = ~2 hours 10 min total.</p>

    <h2>How Many Rounds?</h2>
    <p>7 rounds = every player partners with every other player exactly once. 5 rounds works if you're short on time.</p>

    <h2>Points Per Match</h2>
    <p>24 total points: faster games (~12 min each). 32 total points: longer, more strategic (~18 min each).</p>

    <h2>Why 8 Players Works Best</h2>
    <p>8 is the sweet spot for Americano. Everyone plays every round (no sitting out), you only need 2 courts, and 7 rounds gives a complete rotation in about 2 hours.</p>

    <h2>What If Someone Cancels?</h2>
    <p>7 players: switch to King of the Court where one player rotates out each round. 6 players: play on 1-2 courts with modified pairings.</p>
