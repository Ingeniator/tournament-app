    <h1>How to Organize a Padel Tournament</h1>
    <p>The complete guide for first-time and experienced organizers. Covers planning, checklists, sample schedules, format selection, and free tournament software.</p>
    <nav><a href="/">PadelDay Home</a> &gt; Organize</nav>

    <h2>Before the Event</h2>
    <p>Book 1 court per 4 players. Gather your group via a chat or PadelDay's planning tool. Choose a format: Americano for social play, Mexicano for competitive play, or Team Americano for fixed pairs.</p>

    <h2>Organizer Checklist</h2>
    <ul>
      <li>Courts booked (1 per 4 players, plus 15 min buffer)</li>
      <li>Players confirmed (aim for multiples of 4)</li>
      <li>Format chosen</li>
      <li>New balls (3 per court)</li>
      <li>Phone/tablet charged for scoring</li>
      <li>Water and snacks arranged</li>
      <li>Extra grips and backup rackets</li>
      <li>Start time communicated clearly</li>
    </ul>

    <h2>Sample Tournament Schedules</h2>
    <h3>Quick Social — 8 players, 2 courts, 2 hours</h3>
    <p>5–6 rounds, 15 minutes per round. Great for a weeknight session.</p>
    <h3>Standard Event — 12 players, 3 courts, 3 hours</h3>
    <p>6–7 rounds, 20 minutes per round with short breaks. The most common setup.</p>
    <h3>Full Day Tournament — 16–24 players, 4+ courts, 5+ hours</h3>
    <p>8–10 rounds with a lunch break. Include a group stage and finals for larger groups.</p>

    <h2>Choosing the Right Format</h2>
    <p>Americano for mixed levels, Mexicano for competitive groups, Team Americano for fixed pairs, Mixicano for mixed-gender. See the <a href="/which-format">full format decision tree</a>.</p>

    <h2>Scoring and Standings</h2>
    <p>PadelDay handles scoring automatically. Enter the result after each match, and the app updates individual standings in real time.</p>

    <h2>Common Mistakes</h2>
    <ul>
      <li>Not booking enough court time — always add a buffer</li>
      <li>Odd number of players without a plan</li>
      <li>Manual scoring on paper — use the app instead</li>
      <li>Skipping the awards ceremony</li>
    </ul>
