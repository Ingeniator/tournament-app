    <h1>Padel Tournament Planner Online</h1>
    <p>Plan your padel tournament online. Free tournament planner with player registration, QR code sharing, and instant launch. No account needed.</p>
    <nav><a href="/">PadelDay Home</a> &gt; Planner</nav>

    <h2>How It Works</h2>
    <ol>
      <li>Create — Open PadelDay Planner, set tournament name, date, format, and player limit</li>
      <li>Share — Get a short code and QR code. Share in your WhatsApp or Telegram group. Players open the link and tap Join.</li>
      <li>Watch registrations — See who's signed up in real time. Close registration when ready.</li>
      <li>Launch — One tap to start the live tournament. Pairings generate automatically. Players score on their phones.</li>
    </ol>

    <h2>Why Use the Planner</h2>
    <ul>
      <li>Players register themselves — no back-and-forth</li>
      <li>Shareable link and QR code — works in any chat group</li>
      <li>Real-time registration list</li>
      <li>No signup required for organizer or players</li>
      <li>Works on any device — phone, tablet, laptop</li>
    </ul>

    <h2>What You Can Configure</h2>
    <ul>
      <li>Tournament name and date</li>
      <li>Format (Americano, Mexicano, Team, King of the Court, etc.)</li>
      <li>Number of courts</li>
      <li>Points per match</li>
      <li>Player limit</li>
      <li>Registration open/close</li>
    </ul>

    <h2>After Launch — Live Tournament</h2>
    <ul>
      <li>Automatic pairings every round</li>
      <li>Players enter scores on their own phones</li>
      <li>Live leaderboard visible to everyone</li>
      <li>41 awards at the end — <a href="/awards">see all awards</a></li>
      <li>Everything works offline once loaded</li>
    </ul>

    <h2>Planner vs Running Directly</h2>
    <p>Use the Planner (/plan) when you're organizing in advance and want players to self-register. Use the Runner (/play) when you're already at the courts and want to start immediately. Both are free, both work the same way during the tournament.</p>

    <h2>Frequently Asked Questions</h2>
    <h3>How do I create a tournament?</h3>
    <p>Open PadelDay Planner, set a tournament name, date, format, and player limit. You'll get a short code and QR code to share.</p>
    <h3>How do players register?</h3>
    <p>Share the short code or QR code. Players open the link and tap Join. No account needed.</p>
    <h3>Is there a player limit?</h3>
    <p>You set the limit when creating. Registration closes automatically when full, or you can close it manually.</p>
    <h3>Do players need to download an app?</h3>
    <p>No. PadelDay is a web app — just open the link in any browser.</p>
    <h3>Can I edit the tournament after creating it?</h3>
    <p>Yes. You can change settings at any time before launching.</p>
    <h3>Is it really free?</h3>
    <p>Yes, completely free. No hidden fees, no premium tier, no ads.</p>
